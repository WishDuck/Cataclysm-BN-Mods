name: Build & Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Archive folders
        run: |
          cp LICENSE DuckPerks/
          cp LICENSE FilthyClothing/
          zip -r DuckPerks.zip DuckPerks
          zip -r FilthyClothing.zip FilthyClothing

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$TAG" --clobber \
            DuckPerks.zip \
            FilthyClothing.zip
